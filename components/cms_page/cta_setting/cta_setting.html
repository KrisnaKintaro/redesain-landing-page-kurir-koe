<div class="max-w-5xl mx-auto workspace-anim">
    <div class="mb-8 cms-card-anim">
        <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">Pengaturan Call To Action (CTA)</h2>
        <p class="text-gray-500 mt-2 text-sm sm:text-base">Atur pesan penutup dan link download aplikasi untuk user.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
        
        <!-- KOLOM KIRI (Teks & Tombol) -->
        <div class="lg:col-span-7 space-y-6">
            
            <!-- Card Copywriting -->
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-100 transition-all hover:shadow-md cms-card-anim cms-delay-1">
                <h3 class="text-lg font-bold text-gray-800 border-b border-gray-100 pb-4 mb-5 flex items-center gap-2">
                    <i class="fa-solid fa-pen-nib text-primary"></i> Copywriting
                </h3>
                
                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Tagline</label>
                    <input type="text" id="set-cta-tagline" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-gray-800 font-semibold" placeholder="Contoh: Aplikasi Kurir Koe">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Judul Utama</label>
                    <input type="text" id="set-cta-title" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-gray-800 font-extrabold" placeholder="Contoh: Siap Kirim Paket Pertamamu?">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Deskripsi</label>
                    <textarea id="set-cta-desc" rows="4" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-gray-800 leading-relaxed resize-none" placeholder="Download aplikasi Kurir Koe sekarang..."></textarea>
                </div>
            </div>

            <!-- Card App Buttons -->
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-100 transition-all hover:shadow-md cms-card-anim cms-delay-2">
                <h3 class="text-lg font-bold text-gray-800 border-b border-gray-100 pb-4 mb-5 flex items-center gap-2">
                    <i class="fa-brands fa-google-play text-accent"></i> Tombol Download Aplikasi
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- App Store -->
                    <div class="p-5 border-l-4 border-gray-800 rounded-r-xl bg-gray-50/50 space-y-3">
                        <div class="flex items-center justify-between mb-2">
                            <h4 class="text-xs font-bold text-gray-800 uppercase tracking-widest flex items-center gap-1.5"><i class="fa-brands fa-apple text-sm"></i> App Store</h4>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <span class="text-[10px] font-bold text-gray-500">Tampilkan</span>
                                <input type="checkbox" id="set-cta-app-show" class="w-4 h-4 rounded text-gray-800 focus:ring-gray-800 cursor-pointer">
                            </label>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 mb-1">Sub Teks</label>
                            <input type="text" id="set-cta-app-sub" class="w-full bg-white border border-gray-200 rounded-md px-2 py-1.5 text-xs focus:ring-2 focus:ring-gray-800/20 outline-none text-gray-800" placeholder="Download di">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 mb-1">Label Tombol</label>
                            <input type="text" id="set-cta-app-label" class="w-full bg-white border border-gray-200 rounded-md px-2 py-1.5 text-xs focus:ring-2 focus:ring-gray-800/20 outline-none text-gray-800 font-bold" placeholder="App Store">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 mb-1">Link URL</label>
                            <input type="text" id="set-cta-app-link" class="w-full bg-white border border-gray-200 rounded-md px-2 py-1.5 text-xs focus:ring-2 focus:ring-gray-800/20 outline-none text-gray-800" placeholder="https://...">
                        </div>
                    </div>

                    <!-- Play Store -->
                    <div class="p-5 border-l-4 border-green-500 rounded-r-xl bg-green-50/30 space-y-3">
                        <div class="flex items-center justify-between mb-2">
                            <h4 class="text-xs font-bold text-green-600 uppercase tracking-widest flex items-center gap-1.5"><i class="fa-brands fa-google-play text-sm"></i> Google Play</h4>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <span class="text-[10px] font-bold text-gray-500">Tampilkan</span>
                                <input type="checkbox" id="set-cta-play-show" class="w-4 h-4 rounded text-green-500 focus:ring-green-500 cursor-pointer">
                            </label>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 mb-1">Sub Teks</label>
                            <input type="text" id="set-cta-play-sub" class="w-full bg-white border border-green-200 rounded-md px-2 py-1.5 text-xs focus:ring-2 focus:ring-green-500/20 outline-none text-gray-800" placeholder="Dapatkan di">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 mb-1">Label Tombol</label>
                            <input type="text" id="set-cta-play-label" class="w-full bg-white border border-green-200 rounded-md px-2 py-1.5 text-xs focus:ring-2 focus:ring-green-500/20 outline-none text-gray-800 font-bold" placeholder="Google Play">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 mb-1">Link URL</label>
                            <input type="text" id="set-cta-play-link" class="w-full bg-white border border-green-200 rounded-md px-2 py-1.5 text-xs focus:ring-2 focus:ring-green-500/20 outline-none text-gray-800" placeholder="https://...">
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- KOLOM KANAN (Upload Image) -->
        <div class="lg:col-span-5">
            <!-- Card Ilustrasi CTA -->
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-100 transition-all hover:shadow-md cms-card-anim cms-delay-3 h-full">
                <h3 class="text-lg font-bold text-gray-800 border-b border-gray-100 pb-4 mb-5 flex items-center gap-2">
                    <i class="fa-solid fa-image text-primary"></i> Mockup Aplikasi
                </h3>
                
                <div id="set-cta-drop-zone" class="relative group border-2 border-dashed border-gray-300 rounded-2xl p-6 text-center bg-gray-50 transition-all cursor-pointer flex flex-col items-center justify-center h-[350px]">
                    <input type="file" id="set-cta-img-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" accept="image/png, image/webp, image/jpeg">
                    <img id="set-cta-img-preview" src="" class="absolute inset-0 w-full h-full object-contain p-6 opacity-50 group-hover:opacity-20 transition-opacity z-0">
                    
                    <div class="relative z-10 flex flex-col items-center">
                        <div class="w-12 h-12 bg-white rounded-full shadow-md text-primary flex items-center justify-center mb-3 drag-zone-icon transition-transform duration-300">
                            <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
                        </div>
                        <p class="text-xs font-bold text-gray-700">Drag & Drop Gambar Mockup</p>
                        <p class="text-[10px] text-gray-400 mt-1">Gunakan gambar transparan (.PNG / .WEBP) agar lebih estetik</p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
