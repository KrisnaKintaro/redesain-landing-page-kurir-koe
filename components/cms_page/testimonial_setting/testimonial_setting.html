<div class="max-w-5xl mx-auto workspace-anim">
    <div class="mb-8 cms-card-anim">
        <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">Pengaturan Testimonial</h2>
        <p class="text-gray-500 mt-2 text-sm sm:text-base">Atur teks header dan daftar ulasan pelanggan untuk ditampilkan di landing page.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
        
        <!-- KOLOM KIRI (Header Copywriting) -->
        <div class="lg:col-span-5 space-y-6">
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-100 transition-all hover:shadow-md cms-card-anim cms-delay-1">
                <h3 class="text-lg font-bold text-gray-800 border-b border-gray-100 pb-4 mb-5 flex items-center gap-2">
                    <i class="fa-solid fa-heading text-primary"></i> Teks Header
                </h3>
                
                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Tagline</label>
                    <input type="text" id="set-testi-tagline" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-gray-800 font-semibold" placeholder="Contoh: Testimonial">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Judul Utama</label>
                    <input type="text" id="set-testi-title" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-gray-800 font-extrabold" placeholder="Contoh: Apa Kata Mereka?">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Deskripsi</label>
                    <textarea id="set-testi-desc" rows="4" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-gray-800 leading-relaxed resize-none" placeholder="Ribuan pelanggan dan mitra telah..."></textarea>
                </div>
            </div>
        </div>

        <!-- KOLOM KANAN (List Item Testimonial) -->
        <div class="lg:col-span-7">
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-100 transition-all hover:shadow-md h-full cms-card-anim cms-delay-2">
                <div class="flex items-center justify-between border-b border-gray-100 pb-4 mb-5">
                    <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-comments text-accent"></i> Daftar Ulasan
                    </h3>
                    <button type="button" id="btn-add-testi-item" class="text-xs font-bold bg-blue-50 text-primary hover:bg-primary hover:text-white px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-plus"></i> Tambah Ulasan
                    </button>
                </div>
                
                <!-- Wadah List Dinamis -->
                <div id="testi-list-container" class="space-y-4 max-h-[600px] overflow-y-auto pr-2 cms-scrollbar">
                    <!-- Item testimonial bakal disuntik JS ke sini -->
                </div>
            </div>
        </div>

    </div>
</div>
