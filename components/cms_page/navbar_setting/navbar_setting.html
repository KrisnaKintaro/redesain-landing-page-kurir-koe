<!-- components/cms_page/navbar_setting/navbar_setting.html -->
<div class="max-w-5xl mx-auto workspace-anim">
    <div class="mb-8 cms-card-anim">
        <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">Pengaturan Navbar Master</h2>
        <p class="text-gray-500 mt-2 text-sm sm:text-base">Atur menu navigasi, teks drawer mobile, dan tombol aksi (Login & Download).</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
        
        <!-- KOLOM KIRI (Drawer & Buttons) -->
        <div class="lg:col-span-5 space-y-6">
            
            <!-- Card Mobile Drawer -->
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-100 transition-all hover:shadow-md cms-card-anim cms-delay-1">
                <h3 class="text-lg font-bold text-gray-800 border-b border-gray-100 pb-4 mb-5 flex items-center gap-2">
                    <i class="fa-solid fa-mobile-screen-button text-primary"></i> Mobile Drawer Brand
                </h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Teks 1 (Aksen)</label>
                        <input type="text" id="set-nav-drawer-1" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-gray-800 font-semibold" placeholder="Contoh: Kurir">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Teks 2 (Primary)</label>
                        <input type="text" id="set-nav-drawer-2" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-gray-800 font-semibold" placeholder="Contoh: Koe">
                    </div>
                </div>
            </div>

            <!-- Card Action Buttons -->
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-100 transition-all hover:shadow-md cms-card-anim cms-delay-2">
                <h3 class="text-lg font-bold text-gray-800 border-b border-gray-100 pb-4 mb-5 flex items-center gap-2">
                    <i class="fa-solid fa-hand-pointer text-accent"></i> Tombol Aksi
                </h3>
                
                <div class="space-y-5">
                    <div class="p-4 bg-gray-50 rounded-2xl border border-gray-100">
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">Tombol Login</label>
                        <input type="text" id="set-nav-login-label" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-gray-800 font-semibold mb-2" placeholder="Label, cth: Masuk">
                    </div>

                    <div class="p-4 bg-gray-50 rounded-2xl border border-gray-100">
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">Tombol Download</label>
                        <input type="text" id="set-nav-dl-label" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-gray-800 font-semibold mb-3" placeholder="Label, cth: Download App">
                        
                        <label class="block text-[11px] font-bold text-gray-500 mb-1">Target Section ID</label>
                        <input type="text" id="set-nav-dl-target" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-gray-800" placeholder="cth: cta">
                    </div>
                </div>
            </div>

        </div>

        <!-- KOLOM KANAN (List Menu Dinamis) -->
        <div class="lg:col-span-7">
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-100 transition-all hover:shadow-md h-full cms-card-anim cms-delay-3">
                <div class="flex items-center justify-between border-b border-gray-100 pb-4 mb-5">
                    <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-list text-primary"></i> Navigasi Menu
                    </h3>
                    <button type="button" id="btn-add-nav-menu" class="text-xs font-bold bg-blue-50 text-primary hover:bg-primary hover:text-white px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-plus"></i> Tambah Menu
                    </button>
                </div>
                
                <p class="text-xs text-gray-400 mb-4"><i class="fa-solid fa-circle-info"></i> Gunakan class icon dari <b>FontAwesome</b> (cth: <code>fa-house</code>).</p>
                
                <!-- Wadah List Menu Dinamis -->
                <div id="nav-menu-list-container" class="space-y-3 max-h-[400px] overflow-y-auto pr-2 cms-scrollbar">
                    <!-- Item menu bakal disuntik JS ke sini -->
                </div>

            </div>
        </div>
    </div>
</div>
