<section id="testimonial" class="py-6 lg:py-8 bg-light overflow-hidden">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-7xl">
        
        <!-- Header Seksi -->
        <div class="text-center max-w-3xl mx-auto mb-3">
            <h4 id="testi-tagline" class="text-accent font-bold tracking-widest uppercase text-sm mb-2">Testimonial</h4>
            <h2 id="testi-title" class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-4">Apa Kata Mereka?</h2>
            <p id="testi-desc" class="text-gray-600 text-lg">Ribuan pelanggan dan mitra telah membuktikan keandalan layanan kami.</p>
        </div>

        <!-- Wadah Utama Carousel -->
        <div class="relative max-w-4xl mx-auto" id="testimonial-carousel">
            
            <!-- Track Slider (Ini yang bakal digeser-geser sama JS) -->
            <div class="overflow-visible md:overflow-hidden p-4">
                <div id="testi-track" class="flex transition-transform duration-500 ease-in-out">
                    <!-- Item Kartu Testi bakal di-inject dari JS ke sini -->
                </div>
            </div>

            <!-- Tombol Navigasi Kiri (Prev) -->
            <button id="testi-prev" class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-2 md:-translate-x-8 w-12 h-12 bg-white rounded-full shadow-lg border border-gray-100 text-gray-400 hover:text-primary hover:border-accent transition-all z-20 flex items-center justify-center focus:outline-none">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            
            <!-- Tombol Navigasi Kanan (Next) -->
            <button id="testi-next" class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-2 md:translate-x-8 w-12 h-12 bg-white rounded-full shadow-lg border border-gray-100 text-gray-400 hover:text-primary hover:border-accent transition-all z-20 flex items-center justify-center focus:outline-none">
                <i class="fa-solid fa-chevron-right"></i>
            </button>

        </div>
    </div>
</section>
