<div class="max-w-5xl mx-auto workspace-anim">
    <div class="mb-8">
        <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">Konfigurasi CMS Console ⚙️</h2>
        <p class="text-gray-500 mt-2 text-sm sm:text-base">Atur identitas, tema warna, dan akses developer untuk halaman admin ini.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
        <!-- KOLOM KIRI (Identitas & Developer) -->
        <div class="lg:col-span-7 space-y-6">
            
            <!-- Card Identitas CMS -->
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-100 transition-all hover:shadow-md">
                <h3 class="text-lg font-bold text-gray-800 border-b border-gray-100 pb-4 mb-5 flex items-center gap-2">
                    <i class="fa-solid fa-cube text-primary"></i> CMS Identity
                </h3>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Nama Brand</label>
                        <input type="text" id="set-cms-title" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-gray-800 font-semibold" placeholder="Contoh: Kurir Koe">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Subtitle</label>
                        <input type="text" id="set-cms-subtitle" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-gray-800 font-semibold" placeholder="Contoh: CMS Console">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Global Font Family</label>
                    <div class="relative">
                        <select id="set-cms-font" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none appearance-none font-semibold text-gray-800 cursor-pointer transition-all">
                            <option value="Inter">Inter (Default)</option>
                            <option value="Poppins">Poppins</option>
                            <option value="Roboto">Roboto</option>
                            <option value="Montserrat">Montserrat</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                    </div>
                </div>
            </div>

            <!-- Card Developer Access -->
            <!-- Card Developer Access -->
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-100 transition-all hover:shadow-md">
                <h3 class="text-lg font-bold text-gray-800 border-b border-gray-100 pb-4 mb-5 flex items-center gap-2">
                    <i class="fa-solid fa-user-astronaut text-gray-400"></i> Developer Access
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Nama Developer</label>
                        <input type="text" id="set-cms-dev-name" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-gray-200 outline-none transition-all text-gray-800 font-semibold" placeholder="Contoh: Sang Developer">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Role Status</label>
                        <input type="text" id="set-cms-dev-role" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-gray-200 outline-none transition-all text-gray-500 font-semibold" placeholder="Contoh: Super Admin">
                    </div>
                </div>
            </div>
        </div>

        <!-- KOLOM KANAN (Tema Warna & Logo) -->
        <div class="lg:col-span-5 space-y-6">
            
            <!-- Card Theme Colors -->
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-100 transition-all hover:shadow-md">
                <h3 class="text-lg font-bold text-gray-800 border-b border-gray-100 pb-4 mb-5 flex items-center gap-2">
                    <i class="fa-solid fa-palette text-accent"></i> Theme Colors
                </h3>
                
                <div class="space-y-4">
                    <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-xl border border-gray-100">
                        <div class="relative w-12 h-12 rounded-lg overflow-hidden border-2 border-white shadow-sm shrink-0 cursor-pointer">
                            <input type="color" id="set-cms-primary" class="absolute -inset-2 w-16 h-16 cursor-pointer">
                        </div>
                        <div class="flex flex-col">
                            <span class="text-xs font-bold text-gray-500 uppercase">Primary Color</span>
                            <span id="hex-cms-primary" class="text-sm font-mono font-extrabold text-gray-900">#0054B7</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-xl border border-gray-100">
                        <div class="relative w-12 h-12 rounded-lg overflow-hidden border-2 border-white shadow-sm shrink-0 cursor-pointer">
                            <input type="color" id="set-cms-accent" class="absolute -inset-2 w-16 h-16 cursor-pointer">
                        </div>
                        <div class="flex flex-col">
                            <span class="text-xs font-bold text-gray-500 uppercase">Accent Color</span>
                            <span id="hex-cms-accent" class="text-sm font-mono font-extrabold text-gray-900">#FAD812</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card Logo Upload -->
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-100 transition-all hover:shadow-md">
                <h3 class="text-lg font-bold text-gray-800 border-b border-gray-100 pb-4 mb-5 flex items-center gap-2">
                    <i class="fa-solid fa-image text-primary"></i> Upload Logo
                </h3>
                
                <div id="set-cms-drop-zone" class="relative group border-2 border-dashed border-gray-300 rounded-2xl p-6 text-center bg-gray-50 hover:bg-blue-50/50 hover:border-primary transition-all cursor-pointer flex flex-col items-center justify-center min-h-[180px]">
                    <input type="file" id="set-cms-logo-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" accept="image/png, image/jpeg, image/webp">
                    
                    <div class="w-16 h-16 bg-white rounded-xl shadow-sm border border-gray-200 flex items-center justify-center mb-4 z-0 group-hover:scale-105 transition-transform p-2">
                        <img id="set-cms-logo-preview" src="" class="w-full h-full object-contain">
                    </div>
                    
                    <div class="z-0">
                        <p class="text-xs font-bold text-primary mb-1">Pilih Gambar Baru</p>
                        <p class="text-[10px] font-medium text-gray-400">Format: WEBP, PNG, JPG</p>
                    </div>
                    <!-- Teks notifikasi file terpilih -->
                    <div id="set-cms-file-name" class="mt-2 text-xs font-bold text-green-600 z-0 hidden"></div>
                </div>
            </div>

        </div>
    </div>
</div>
